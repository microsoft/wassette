# Vendored from bytecodealliance/wstd, branch `p3` (PR #129), commit
# c3bac234b01774b95ff3510351ec6fc674fd81e2, with local patches; see README.vendor.md.
[package]
name = "wstd"
version = "0.6.8"
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/bytecodealliance/wstd"
description = "An async standard library for Wasm Components and WASI 0.2 (vendored p3 branch)"
rust-version = "1.91.1"
publish = false

[features]
default = ["json", "wasip2"]
json = ["dep:serde", "dep:serde_json"]
wasip2 = ["dep:wasip2"]
wasip3 = ["dep:wasip3", "dep:wit-bindgen"]

[dependencies]
anyhow = "1"
async-task = "4.7"
bytes = "1.10.1"
cfg-if = "1"
futures-lite = "1.12.0"
http = "1.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
itoa = "1"
pin-project-lite = "0.2.8"
slab = "0.4.9"
wasip2 = { version = "1.0", optional = true }
wasip3 = { version = "0.9", optional = true }
# Same version as wasip3's own wit-bindgen so Cargo unifies the async
# runtime features (`async_support::spawn` is gated on `async-spawn`).
wit-bindgen = { version = "0.62", default-features = false, features = ["async", "async-spawn", "inter-task-wakeup"], optional = true }
wstd-macro = { path = "../wstd-macro", version = "=0.6.8" }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(all(target_os = "wasi", target_env = "p3"))'.dependencies]
wasip3 = "0.9"
