[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.6.0"
license = "MIT"
license-file = "LICENSE"

[workspace.dependencies]
anyhow = "1.0"
component2json = { path = "crates/component2json" }
etcetera = "0.11"
futures = "0.3"
wassette = { path = "crates/wassette" }
mcp-sdk = "0.0.3"
mcp-server = { path = "crates/mcp-server" }
oci-client = "0.17"
oci-wasm = { version = "0.6", default-features = false, features = ["rustls-tls"] }
policy = { path = "crates/policy" }
reqwest = { version = "0.13", features = ["stream"] }
rmcp = "3.1.3"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
serde = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.25"
test-log = "0.2"
thiserror = "2.0.17"
tokio = "1.49"
tokio-stream = "0.1"
tokio-test = "0.4"
tokio-util = "0.7.18"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-test = "0.2"
wasmtime = "47.0.3"
wasmtime-wasi = "47.0.3"
wasmtime-wasi-http = "47.0.3"
wasmtime-wasi-config = "47.0.3"

[profile.release]
codegen-units = 1
lto = true
