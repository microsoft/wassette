[package]
name = "acp-ollama-provider"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
wit-bindgen = { version = "0.62.0", features = ["bitflags", "async", "async-spawn"] }
wstd = { path = "../../vendor/wstd", default-features = false, features = ["json", "wasip3"] }

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
lto = true

[workspace]
