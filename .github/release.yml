# Configuration for GitHub's automatically generated release notes.
# The release workflow calls the generate-notes API, which groups merged pull
# requests into the categories below based on their labels.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - skip-changelog
      - automated
      - release
    authors:
      - dependabot
      - github-actions
  categories:
    - title: Breaking Changes 🛠
      labels:
        - breaking-change
    - title: New Features 🎉
      labels:
        - enhancement
    - title: Bug Fixes 🐛
      labels:
        - bug
    - title: Security 🔒
      labels:
        - security
    - title: Documentation 📚
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
