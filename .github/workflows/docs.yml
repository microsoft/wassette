name: Deploy Documentation

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install mdBook
        run: |
          mkdir bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz --directory=bin
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building documentation for version: $VERSION"

      - name: Build with mdBook
        run: |
          cd docs
          mdbook build

      - name: Prepare versioned output
        run: |
          mkdir -p public/wassette/${{ steps.version.outputs.version }}
          cp -r docs/book/* public/wassette/${{ steps.version.outputs.version }}/
          
          # Copy root redirect page
          cp docs/index.html public/wassette/index.html
          
          # Download existing versions.json from gh-pages if it exists, or use the default
          echo "Fetching existing versions.json..."
          curl -f https://microsoft.github.io/wassette/versions.json -o public/wassette/versions.json || cp docs/versions.json public/wassette/versions.json
          
          # Update versions.json with current version
          python3 << 'EOF'
          import json
          import sys
          
          version = "${{ steps.version.outputs.version }}"
          
          try:
              with open("public/wassette/versions.json", "r") as f:
                  data = json.load(f)
          except:
              data = {"versions": ["latest"], "latest": "latest"}
          
          # Add current version if it's not already in the list
          if version not in data["versions"]:
              # Insert version after "latest" if it's a tag
              if version.startswith("v"):
                  if "latest" in data["versions"]:
                      idx = data["versions"].index("latest") + 1
                      data["versions"].insert(idx, version)
                  else:
                      data["versions"].insert(0, version)
              else:
                  # Ensure "latest" is first
                  if "latest" not in data["versions"]:
                      data["versions"].insert(0, "latest")
          
          with open("public/wassette/versions.json", "w") as f:
              json.dump(data, f, indent=2)
          
          print(f"Updated versions.json with version: {version}")
          EOF
          
          echo "Current versions.json:"
          cat public/wassette/versions.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
