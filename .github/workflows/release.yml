name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag (e.g., v0.4.0 or v0.4.1-rc1)'
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate tag and package version
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: tag must use the vX.Y.Z or vX.Y.Z-suffix format"
            exit 1
          fi

          if ! git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Error: tag $RELEASE_TAG does not exist"
            exit 1
          fi

          TAG_VERSION="${RELEASE_TAG#v}"
          TAG_BASE_VERSION="${TAG_VERSION%%-*}"
          PACKAGE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] && [ "$TAG_BASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: tag $RELEASE_TAG does not match Cargo.toml version $PACKAGE_VERSION"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux targets
          - target: x86_64-unknown-linux-gnu
            name: wassette
            arch: linux_amd64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            name: wassette
            arch: linux_arm64
            runner: ubuntu-24.04-arm
          # macOS targets
          - target: x86_64-apple-darwin
            name: wassette
            arch: darwin_amd64
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            name: wassette
            arch: darwin_arm64
            runner: macos-latest
          # Windows targets
          - target: x86_64-pc-windows-msvc
            name: wassette
            arch: windows_amd64
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            name: wassette
            arch: windows_arm64
            runner: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Sccache Action
        if: matrix.target != 'aarch64-pc-windows-msvc' && matrix.target != 'x86_64-apple-darwin'
        uses: Mozilla-Actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
        with:
          target: ${{ matrix.target }}

      - name: Add WASM target
        run: rustup target add wasm32-wasip2

      - name: Build release binary
        run: cargo build --release
        env:
          SCCACHE_GHA_ENABLED: ${{ matrix.target != 'aarch64-pc-windows-msvc' && matrix.target != 'x86_64-apple-darwin' && 'true' || 'false' }}
          RUSTC_WRAPPER: ${{ matrix.target != 'aarch64-pc-windows-msvc' && matrix.target != 'x86_64-apple-darwin' && 'sccache' || '' }}

      - name: Extract version (Unix)
        if: "!contains(matrix.target, 'windows')"
        id: version-unix
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract version (Windows)
        if: contains(matrix.target, 'windows')
        id: version-windows
        run: |
          $VERSION = "${{ env.RELEASE_TAG }}" -replace '^v', ''
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Set version output
        id: version
        run: |
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            echo "version=${{ steps.version-windows.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.version-unix.outputs.version }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Prepare binary (Unix)
        if: "!contains(matrix.target, 'windows')"
        run: |
          cd target/release
          tar czvf ../../${{ matrix.name }}_${{ steps.version.outputs.version }}_${{ matrix.arch }}.tar.gz wassette
          cd -

      - name: Prepare binary (Windows)
        if: contains(matrix.target, 'windows')
        run: |
          cd target/release
          7z a ../../${{ matrix.name }}_${{ steps.version.outputs.version }}_${{ matrix.arch }}.zip wassette.exe
          cd -
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}-${{ matrix.arch }}
          path: |
            ${{ matrix.name }}_*_${{ matrix.arch }}.tar.gz
            ${{ matrix.name }}_*_${{ matrix.arch }}.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate-release, build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Extract version and detect prerelease
        id: version
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Detect if this is a prerelease (contains hyphen, e.g., v0.3.4-test1)
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Detected prerelease version: $VERSION"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Detected stable version: $VERSION"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts -name "*.zip" -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            --jq '.body' > release-notes.md
          cat >> release-notes.md <<EOF

          ## Downloads

          ### Linux
          - [AMD64 (tar.gz)](https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/wassette_${VERSION}_linux_amd64.tar.gz)
          - [ARM64 (tar.gz)](https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/wassette_${VERSION}_linux_arm64.tar.gz)

          ### macOS (Darwin)
          - [AMD64/Intel (tar.gz)](https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/wassette_${VERSION}_darwin_amd64.tar.gz)
          - [ARM64/Apple Silicon (tar.gz)](https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/wassette_${VERSION}_darwin_arm64.tar.gz)

          ### Windows
          - [AMD64 (zip)](https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/wassette_${VERSION}_windows_amd64.zip)
          - [ARM64 (zip)](https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/wassette_${VERSION}_windows_arm64.zip)

          ## Install

          ### All Platforms (Shell Script)

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install.sh | WASSETTE_GITHUB_REPO=$GITHUB_REPOSITORY bash
          \`\`\`

          This will detect your platform and install the latest \`wassette\` binary to your \`\$PATH\`.

          ## Usage
          \`\`\`bash
          # Local MCP client integration (stdio)
          wassette run

          # Remote MCP server (Streamable HTTP)
          wassette serve
          \`\`\`
          EOF

      - name: Create draft, upload assets, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          EXPECTED_ASSETS=(
            "wassette_${VERSION}_linux_amd64.tar.gz"
            "wassette_${VERSION}_linux_arm64.tar.gz"
            "wassette_${VERSION}_darwin_amd64.tar.gz"
            "wassette_${VERSION}_darwin_arm64.tar.gz"
            "wassette_${VERSION}_windows_amd64.zip"
            "wassette_${VERSION}_windows_arm64.zip"
          )
          mapfile -t FOUND_ASSETS < <(find release-assets -maxdepth 1 -type f | sort)
          if [ "${#FOUND_ASSETS[@]}" -ne "${#EXPECTED_ASSETS[@]}" ]; then
            echo "::error::Expected ${#EXPECTED_ASSETS[@]} release assets, found ${#FOUND_ASSETS[@]}"
            exit 1
          fi

          ASSETS=()
          for NAME in "${EXPECTED_ASSETS[@]}"; do
            ASSET="release-assets/$NAME"
            if [ ! -f "$ASSET" ]; then
              echo "::error::Missing expected release asset $NAME"
              exit 1
            fi
            ASSETS+=("$ASSET")
          done

          if RELEASE_STATE=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft' 2>/dev/null); then
            if [ "$RELEASE_STATE" != "true" ]; then
              PUBLISHED_ASSETS=$(gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name')
              MISSING_ASSETS=0
              for ASSET in "${ASSETS[@]}"; do
                NAME=$(basename "$ASSET")
                if ! grep -Fxq "$NAME" <<< "$PUBLISHED_ASSETS"; then
                  echo "::error::Published release is missing asset $NAME"
                  MISSING_ASSETS=1
                fi
              done
              if [ "$MISSING_ASSETS" -ne 0 ]; then
                echo "::error::Release $RELEASE_TAG is already published and cannot be repaired by this workflow"
                exit 1
              fi
              echo "Release $RELEASE_TAG is already published with all expected assets"
              exit 0
            fi

            EDIT_ARGS=(
              "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --draft
              --title "$RELEASE_TAG"
              --notes-file release-notes.md
            )
            if [ "$IS_PRERELEASE" = "true" ]; then
              EDIT_ARGS+=(--prerelease)
            fi
            gh release edit "${EDIT_ARGS[@]}"
          else
            CREATE_ARGS=(
              "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --draft
              --verify-tag
              --title "$RELEASE_TAG"
              --notes-file release-notes.md
            )
            if [ "$IS_PRERELEASE" = "true" ]; then
              CREATE_ARGS+=(--prerelease)
            fi
            gh release create "${CREATE_ARGS[@]}"
          fi

          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          UPLOADED_ASSETS=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')
          for ASSET in "${ASSETS[@]}"; do
            NAME=$(basename "$ASSET")
            if ! grep -Fxq "$NAME" <<< "$UPLOADED_ASSETS"; then
              echo "::error::Draft release is missing asset $NAME"
              exit 1
            fi
          done

          PUBLISH_ARGS=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --draft=false
          )
          if [ "$IS_PRERELEASE" = "true" ]; then
            PUBLISH_ARGS+=(--prerelease)
          fi
          gh release edit "${PUBLISH_ARGS[@]}"

  update-package-manifests:
    name: Update package manifests
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.result == 'success' && !contains(github.event.inputs.tag_name || github.ref_name, '-')

    steps:
      - name: Dispatch package manifest update
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-package-manifests.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag_name="$RELEASE_TAG"

  publish-examples:
    name: Publish example components
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.result == 'success' && !contains(github.event.inputs.tag_name || github.ref_name, '-')

    steps:
      - name: Dispatch example component publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run examples.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$RELEASE_TAG"

  publish-docs:
    name: Publish versioned documentation
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.result == 'success' && !contains(github.event.inputs.tag_name || github.ref_name, '-')

    steps:
      - name: Dispatch versioned documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag_name="$RELEASE_TAG"
