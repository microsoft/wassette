name: Publish Examples

on:
  push:
    branches: [ "main" ]
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to use for the OCI artifacts (e.g., v0.4.0 or latest).'
        required: true
        type: string
        default: 'latest'

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  GO_VERSION: 1.26.5
  TINYGO_VERSION: 0.41.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ startsWith(github.event.inputs.tag, 'v') && github.event.inputs.tag || github.ref }}
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
    - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3.0.1
      with:
        tinygo-version: ${{ env.TINYGO_VERSION }}
    - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
    - run: ./scripts/install-protobuf.sh
      shell: bash
    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
    - run: rustup target add wasm32-wasip2

    - name: Install wit-docs-inject
      run: cargo install --git https://github.com/Mossaka/wit-docs-inject

    - name: Build
      run: just build-examples

    - name: Upload wasm
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: examples
        path: bin

  publish:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || !contains(github.event.inputs.tag, '-'))
    permissions:
      contents: read
      packages: write
      id-token: write
    needs: build
    strategy:
      matrix:
        component:
          - name: arxiv-rs
            file: arxiv-rs.wasm
          - name: github-js
            file: github-js.wasm
          - name: gomodule-go
            file: gomodule.wasm
          - name: eval-py
            file: eval-py.wasm
          - name: time-server-js
            file: time-server-js.wasm
          - name: get-weather-js
            file: get-weather-js.wasm
          - name: memory-js
            file: memory-js.wasm
          - name: filesystem-rs
            file: filesystem.wasm
          - name: fetch-rs
            file: fetch-rs.wasm
          - name: brave-search-rs
            file: brave-search-rs.wasm
          - name: context7-rs
            file: context7-rs.wasm
          - name: get-open-meteo-weather-js
            file: get-open-meteo-weather-js.wasm
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: examples
          path: bin

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.1'
      - name: Install wkg
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh |
            bash
          cargo binstall --no-confirm wkg@0.15.1

      - name: Determine tag
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "latest=true" >> $GITHUB_OUTPUT
            if [[ "$INPUT_TAG" == v* ]]; then
              echo "tag=${INPUT_TAG#v}" >> $GITHUB_OUTPUT
              echo "release_tag=latest" >> $GITHUB_OUTPUT
            else
              echo "tag=$GITHUB_SHA" >> $GITHUB_OUTPUT
              echo "release_tag=$INPUT_TAG" >> $GITHUB_OUTPUT
            fi
          else
            echo "tag=$GITHUB_SHA" >> $GITHUB_OUTPUT
            echo "latest=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish ${{ matrix.component.name }}
        id: publish_versioned
        env:
          FILE: bin/${{ matrix.component.file }}
          OCI_REFERENCE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          output=$(wkg oci push "$OCI_REFERENCE:$VERSION" "$FILE" \
            --annotation "org.opencontainers.image.description=" \
            --annotation "org.opencontainers.image.source=" \
            --annotation "org.opencontainers.image.url=" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.licenses=")
          echo "$output"
          digest=$(echo "$output" | grep -oP 'digest: \K.*')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign container image ${{ matrix.component.name }}:${{ steps.meta.outputs.tag }}
        run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}@${{ steps.publish_versioned.outputs.digest }}

      - name: Publish ${{ matrix.component.name }} with tag ${{ steps.meta.outputs.release_tag || 'latest' }} (if specified)
        id: publish_latest
        if: steps.meta.outputs.latest == 'true'
        env:
          FILE: bin/${{ matrix.component.file }}
          OCI_REFERENCE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
          VERSION: ${{ steps.meta.outputs.release_tag || 'latest' }}
        run: |
          set -euo pipefail
          output=$(wkg oci push "$OCI_REFERENCE:$VERSION" "$FILE" \
            --annotation "org.opencontainers.image.description=" \
            --annotation "org.opencontainers.image.source=" \
            --annotation "org.opencontainers.image.url=" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.licenses=")
          echo "$output"
          digest=$(echo "$output" | grep -oP 'digest: \K.*')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign container image ${{ matrix.component.name }}:${{ steps.meta.outputs.release_tag || 'latest' }}
        if: steps.meta.outputs.latest == 'true'
        run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}@${{ steps.publish_latest.outputs.digest }}
