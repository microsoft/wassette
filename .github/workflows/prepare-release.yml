name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version without v prefix (e.g., 0.4.0 or 0.4.0-rc1)'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare-release:
    name: Prepare Release PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: Version must use X.Y.Z or X.Y.Z-suffix format (e.g., 0.4.0 or 0.4.0-rc1)"
            exit 1
          fi
          echo "Valid version format: $VERSION"

      - name: Install pinned WIT binding generator
        run: |
          cargo install wit-bindgen-cli --version 0.54.0 --locked

      - name: Update release versions and generated bindings
        run: |
          ./scripts/update-release-version.sh "${{ inputs.version }}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          commit-message: "chore(release): bump version to ${{ inputs.version }}"
          branch: release/v${{ inputs.version }}
          delete-branch: false
          title: "chore(release): bump version to ${{ inputs.version }}"
          body: |
            This pull request prepares the ${{ inputs.version }} release by updating the workspace and ACP interface versions together.

            ## Changes
            - Updated version in `Cargo.toml` to `${{ inputs.version }}`
            - Updated `Cargo.lock` to reflect the version change
            - Updated `wassette:acp` to `${{ inputs.version }}`
            - Regenerated the ACP provider and layer bindings

            ## Next Steps
            1. Review and merge this PR to main
            2. After merge, run the `Release` workflow (or `gh workflow run release.yml -f version=${{ inputs.version }}`) to build the binaries, tag `v${{ inputs.version }}`, and publish the GitHub release with auto-generated release notes
            3. For stable releases, the update-package-manifests workflow will create a PR to update Homebrew and WinGet manifests
            
            **Note:** Versions with a suffix are published as prereleases and skip package manifest, example component, ACP component, and versioned documentation updates.
          labels: |
            release
            automated
