name: Publish Components

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable Wassette release tag to publish (for example, v0.8.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Validate stable tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must use the stable vX.Y.Z format"
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build publishable components
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: wasm32-wasip2

      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3

      - name: Verify release version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          package_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          wit_version=$(sed -n 's/^package wassette:acp@\(.*\);/\1/p' crates/wassette-acp/wit/acp/world.wit)
          if [[ "$package_version" != "$VERSION" || "$wit_version" != "$VERSION" ]]; then
            echo "::error::release tag, workspace version, and ACP WIT version must match"
            exit 1
          fi

      - name: Build artifacts
        run: just build-publishable-components

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publishable-components
          path: |
            bin/acp.wasm
            bin/acp-echo-provider.wasm
            bin/acp-uppercase-layer.wasm

  publish:
    name: Publish ${{ matrix.component.name }}
    runs-on: ubuntu-latest
    needs: [validate, build]
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: acp
            file: acp.wasm
            description: Agent Client Protocol interface types for Wassette components
          - name: acp-echo-provider
            file: acp-echo-provider.wasm
            description: Offline echo provider for Wassette ACP
          - name: acp-uppercase-layer
            file: acp-uppercase-layer.wasm
            description: Uppercase middleware layer for Wassette ACP

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publishable-components
          path: bin

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.1'

      - name: Install wkg
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh |
            bash
          cargo binstall --no-confirm wkg@0.15.1

      - name: Publish ${{ matrix.component.name }}:${{ needs.validate.outputs.version }}
        id: publish
        env:
          DESCRIPTION: ${{ matrix.component.description }}
          FILE: bin/${{ matrix.component.file }}
          OCI_REFERENCE: ghcr.io/${{ github.repository }}/${{ matrix.component.name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          output=$(wkg oci push "$OCI_REFERENCE:$VERSION" "$FILE" \
            --annotation "org.opencontainers.image.description=$DESCRIPTION" \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.url=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.licenses=MIT")
          echo "$output"
          digest=$(sed -n 's/.*digest: //p' <<< "$output" | tail -n1)
          if [[ -z "$digest" ]]; then
            echo "::error::wkg did not report a digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign ${{ matrix.component.name }}:${{ needs.validate.outputs.version }}
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          OCI_REFERENCE: ghcr.io/${{ github.repository }}/${{ matrix.component.name }}
        run: cosign sign --yes "$OCI_REFERENCE@$DIGEST"
