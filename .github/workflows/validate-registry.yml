name: Validate Component Registry

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'component-registry.json'

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Fetch all history to compare with main branch

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'

    - name: Install build dependencies
      run: ./scripts/install-protobuf.sh
      shell: bash

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

    - uses: ./.github/actions/rust-cache

    - name: Setup Just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Build wassette
      run: just build release

    - name: Validate component registry
      run: ./scripts/validate-component-registry.sh

    - name: Summary
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "## ✓ Component Registry Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All new and modified component URIs were successfully validated." >> $GITHUB_STEP_SUMMARY
        else
          echo "## ✗ Component Registry Validation Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more component URIs failed validation. Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
        fi
