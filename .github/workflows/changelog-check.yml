name: Changelog Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    name: Require changelog entry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changelog policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
          AUTOMATED_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'automated') && startsWith(github.event.pull_request.head.ref, 'release/v') }}
        run: |
          if [[ "$SKIP_CHANGELOG" == "true" ]]; then
            echo "Skipping changelog check because the PR has the skip-changelog label."
            exit 0
          fi

          if [[ "$AUTOMATED_RELEASE" == "true" ]]; then
            echo "Skipping changelog check for an automated release maintenance PR."
            exit 0
          fi

          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git show "$sha:CHANGELOG.md" | grep -Fxq "## [Unreleased]"; then
              echo "::error::CHANGELOG.md must contain an [Unreleased] section."
              exit 1
            fi
          done

          unreleased() {
            git show "$1:CHANGELOG.md" |
              awk '
                $0 == "## [Unreleased]" { found = 1; next }
                found && /^## \[/ { exit }
                found { print }
              '
          }

          if diff -q <(unreleased "$BASE_SHA") <(unreleased "$HEAD_SHA") >/dev/null; then
            echo "::error::User-facing changes must update CHANGELOG.md under [Unreleased]."
            echo "::error::If this change has no user impact, apply the skip-changelog label."
            exit 1
          fi

          echo "The [Unreleased] section is updated."
