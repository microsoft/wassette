[package]
name = "acp-routing-provider"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata.cargo-machete]
# The generated bindings included via #[path] use this runtime outside this crate's tree.
ignored = ["wit-bindgen"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "=0.62.0", features = ["bitflags", "async", "async-spawn"] }

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
lto = true

[workspace]
